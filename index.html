<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d1a">
<title>Battle Beasts Checklist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap');

:root {
  --bg:       #0d0d1a;
  --surface:  #141428;
  --card:     #1a1a35;
  --card-own: #1a0f38;
  --border:   #2a2a50;
  --accent:   #e63060;
  --gold:     #f0b429;
  --fg:       #e8e8f0;
  --dim:      #6666aa;
  --mid:      #9999cc;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg);
  font-family: 'Barlow', sans-serif; overscroll-behavior: none; }

/* ── LOADING ── */
#loading-screen {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
}
.spinner {
  width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { color: var(--dim); font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px; letter-spacing: 2px; }

/* ── AUTH ── */
#auth-screen {
  min-height: 100vh; display: none;
  align-items: center; justify-content: center; padding: 20px;
}
.auth-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 380px;
}
.auth-logo {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: 28px; color: var(--accent); text-align: center;
  letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
}
.auth-sub { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 26px; }
.auth-tabs {
  display: flex; margin-bottom: 22px;
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
.auth-tab {
  flex: 1; padding: 9px; text-align: center; cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 14px; letter-spacing: .5px; color: var(--dim);
  background: transparent; border: none; transition: all .15s;
}
.auth-tab.on { background: var(--accent); color: #fff; }
.auth-field { margin-bottom: 14px; }
.auth-field label {
  display: block; font-size: 11px; color: var(--mid); margin-bottom: 5px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  letter-spacing: .5px; text-transform: uppercase;
}
.auth-field input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; color: var(--fg);
  font-family: 'Barlow', sans-serif; font-size: 14px; outline: none;
}
.auth-field input:focus { border-color: var(--accent); }
.auth-submit {
  width: 100%; background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 12px; font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 16px; letter-spacing: 1px;
  cursor: pointer; transition: background .15s; margin-top: 4px;
}
.auth-submit:hover { background: #c02050; }
.auth-submit:disabled { background: var(--border); cursor: default; }
.auth-msg { text-align: center; font-size: 13px; margin-top: 12px;
  min-height: 18px; color: var(--gold); }
.auth-msg.err { color: var(--accent); }
.auth-reset { text-align: center; margin-top: 10px; }
.auth-reset button {
  background: none; border: none; color: var(--dim); font-size: 12px;
  cursor: pointer; text-decoration: underline; font-family: 'Barlow', sans-serif;
}

/* ── APP ── */
#app-screen { display: none; flex-direction: column; min-height: 100vh; }

/* ── TOOLBAR ── */
.toolbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,22,0.97); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); padding: 9px 12px 7px;
}
.tb-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.logo {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: 18px; color: var(--accent); letter-spacing: 1px;
  white-space: nowrap; text-transform: uppercase; flex-shrink: 0;
}
.search {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 6px 11px; color: var(--fg);
  font-family: 'Barlow', sans-serif; font-size: 14px; outline: none; min-width: 0;
}
.search:focus { border-color: var(--accent); }
.search::placeholder { color: var(--dim); }
.user-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--mid); font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 11px; padding: 5px 9px;
  border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.tb-row2 { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.fbtn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--mid); font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 12px; letter-spacing: .5px;
  padding: 4px 11px; border-radius: 6px; cursor: pointer; transition: all .15s;
}
.fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.stats { font-size: 11px; color: var(--dim); margin-left: 2px; }
.stats b { color: var(--gold); }
.tb-right { margin-left: auto; display: flex; gap: 5px; align-items: center; }
.tbtn {
  background: transparent; border: 1px solid var(--border);
  color: var(--dim); font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 11px; letter-spacing: .5px;
  padding: 4px 9px; border-radius: 6px; cursor: pointer; transition: all .15s;
}
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
  display: inline-block; opacity: 0; transition: opacity .3s; flex-shrink: 0;
}
.sync-dot.active { opacity: 1; }

/* ── GRID ── */
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 7px; padding: 10px 8px 80px;
}
@media (min-width: 480px) { .grid { grid-template-columns: repeat(4,1fr); } }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(5,1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(7,1fr); gap: 10px; } }

/* ── CARD ── */
.card {
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 10px; display: flex; flex-direction: column;
  align-items: stretch; padding: 6px 6px 8px;
  transition: box-shadow .2s, border-color .2s, background .2s;
}
.card.owned {
  background: var(--card-own); border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 4px 18px rgba(230,48,96,.25);
}
.card-img-wrap {
  width: 100%; aspect-ratio: 1; background: var(--surface); border-radius: 7px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.card-img-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card-ph {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px; font-weight: 900; color: var(--border);
}
.card-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: 12px; color: var(--accent); text-align: center;
  line-height: 1.2; padding: 5px 2px 5px; word-break: break-word;
}
.star-row { display: flex; align-items: center; gap: 4px; padding: 0 2px 4px; }
.star-label {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 11px; color: #7fff50; width: 44px; flex-shrink: 0;
}
.stars { display: flex; gap: 2px; }
.star { width: 16px; height: 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.star svg { width: 100%; height: 100%; display: block; }
.elem-row {
  display: flex; align-items: center; justify-content: space-around;
  padding: 4px 2px 2px; gap: 3px;
  border-top: 1px solid var(--border); margin-top: 2px;
}
.elem-btn {
  width: 30%; aspect-ratio: 3/2; border-radius: 5px; overflow: hidden;
  cursor: pointer; border: 2px solid transparent;
  transition: border-color .15s, opacity .15s; opacity: 0.45;
  background: var(--surface); display: flex; align-items: center;
  justify-content: center; -webkit-tap-highlight-color: transparent;
}
.elem-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.elem-btn.sel { opacity: 1; border-color: var(--gold); }
.elem-ph { font-size: 10px; color: var(--dim);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }
.empty { grid-column:1/-1; text-align:center; padding:60px 20px;
  color:var(--dim); font-family:'Barlow Condensed',sans-serif; font-size:20px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--surface); border: 1px solid var(--border);
  color: var(--fg); font-size: 13px; padding: 9px 18px;
  border-radius: 20px; transition: transform .3s; z-index: 999;
  white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
#csv-file { display: none; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div class="loading-txt">LOADING…</div>
</div>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">⚔ Battle Beasts</div>
    <div class="auth-sub">Collector Checklist</div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-submit" id="auth-btn" onclick="doAuth()">Login</button>
    <div class="auth-msg" id="auth-msg"></div>
    <div class="auth-reset">
      <button onclick="doReset()">Forgot password?</button>
    </div>
  </div>
</div>

<!-- App -->
<div id="app-screen">
  <div class="toolbar">
    <div class="tb-row1">
      <div class="logo">⚔ Battle Beasts</div>
      <input class="search" id="search" type="search" placeholder="Search…" autocomplete="off">
      <button class="user-btn" id="user-btn" onclick="doLogout()">Sign Out</button>
    </div>
    <div class="tb-row2">
      <button class="fbtn on" data-f="all">All</button>
      <button class="fbtn" data-f="owned">Owned</button>
      <button class="fbtn" data-f="unowned">Unowned</button>
      <span class="stats" id="stats"></span>
      <div class="tb-right">
        <span class="sync-dot" id="sync-dot"></span>
        <button class="tbtn" id="btn-export">Export</button>
        <button class="tbtn" id="btn-import">Import</button>
        <input type="file" id="csv-file" accept=".csv">
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged,
         signInWithEmailAndPassword,
         createUserWithEmailAndPassword,
         signOut, sendPasswordResetEmail }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, collection,
         getDocs, writeBatch, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ── Firebase config ────────────────────────────────────────────────────────
const app = initializeApp({
  apiKey:            "AIzaSyDIev9p4_kaIslT_zG8cQFn_JAEKMmzkd0",
  authDomain:        "battle-beasts-32a4e.firebaseapp.com",
  projectId:         "battle-beasts-32a4e",
  storageBucket:     "battle-beasts-32a4e.firebasestorage.app",
  messagingSenderId: "673073374258",
  appId:             "1:673073374258:web:abbaeefab7d5f5b8cd482b",
});
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Image base ─────────────────────────────────────────────────────────────
const IMG = 'https://raw.githubusercontent.com/Turtleformers/Battle-Beasts/main/images/';

// ── Beast data ─────────────────────────────────────────────────────────────
const BEASTS = [
  [1,"Pirate Lion","Series 1"],[2,"Deer Stalker","Series 1"],
  [3,"Ferocious Tiger","Series 1"],[4,"Colonel Bird","Series 1"],
  [5,"Killer Carp","Series 1"],[6,"Triple Threat Snake","Series 1"],
  [7,"Horny Toad","Series 1"],[8,"Sledgehammer Elephant","Series 1"],
  [9,"Rocky Rhino","Series 1"],[10,"Roamin' Buffalo","Series 1"],
  [11,"Grizzly Bear","Series 1"],[12,"Blitzkrieg Bat","Series 1"],
  [13,"Gargantuan Gorilla","Series 1"],[14,"Swiny Boar","Series 1"],
  [15,"Gruesome Gator","Series 1"],[16,"Sly Fox","Series 1"],
  [17,"Hardtop Tortoise","Series 1"],[18,"Rubberneck Giraffe","Series 1"],
  [19,"Prickly Porcupine","Series 1"],[20,"Sawtooth Shark","Series 1"],
  [21,"Danger Dog","Series 1"],[22,"Hare Razing Rabbit","Series 1"],
  [23,"Sir Sire Horse","Series 1"],[24,"War Weasel","Series 1"],
  [25,"Bloodthirsty Bison","Series 1"],[26,"Bighorn Sheep","Series 1"],
  [27,"Webslinger Spider","Series 1"],[28,"Crusty Crab","Series 1"],
  [29,"Icky Iguana","Series 2"],[30,"Armored Armadillo","Series 2"],
  [31,"Jaded Jag","Series 2"],[32,"Humongous Hippo","Series 2"],
  [33,"Major Moose","Series 2"],[34,"Delta Chameleon","Series 2"],
  [35,"Kickback Kangaroo","Series 2"],[36,"Octillion Octopus","Series 2"],
  [37,"Wolfgang Walrus","Series 2"],[38,"Powerhouse Mouse","Series 2"],
  [39,"Dragoon Raccoon","Series 2"],[40,"Antic Anteater","Series 2"],
  [41,"Run Amuck Duck","Series 2"],[42,"Miner Mole","Series 2"],
  [43,"Cutthroat Cuttlefish","Series 2"],[44,"Eager Beaver","Series 2"],
  [45,"Slasher Seahorse","Series 2"],[46,"Knight Owl","Series 2"],
  [47,"Hunchback Camel","Series 2"],[48,"Pillaging Polar Bear","Series 2"],
  [49,"Squire Squirrel","Series 2"],[50,"Saber Sword Tiger","Series 2"],
  [51,"Bludgeoning Bulldog","Series 2"],[52,"Pew-Trid Skunk","Series 2"],
  [53,"Panzer Panda","Series 3"],[54,"Leapin' Lizard","Series 3"],
  [55,"Killer Koala","Series 3"],[56,"Tarsier Tyrant","Series 3"],
  [57,"Black Panther","Series 3"],[58,"Torrential Tapir","Series 3"],
  [59,"King Cobra","Series 3"],[60,"Manic Mandrill","Series 3"],
  [61,"Pixilated Pointer","Series 3"],[62,"Pillager Pig","Series 3"],
  [63,"Rowdy Rooster","Series 3"],[64,"Musky Ox","Series 3"],
  [65,"Tanglin Pangolin","Series 3"],[66,"Slowpoke Sloth","Series 3"],
  [67,"Ardent Aardvark","Series 3"],[68,"Bodacious Bovine","Series 3"],
  [69,"Zealot Zebra","Series 3"],[70,"Harrier Hawk","Series 3"],
  [71,"Diving Duckbill","Series 3"],[72,"Crooked Crow","Series 3"],
  [73,"Frenzied Flamingo","Series 3"],[74,"Fleet-Footed Antelope","Series 3"],
  [75,"Pugnacious Penguin","Series 3"],[76,"Ossified Orangutan","Series 3"],
];

const ELEMS = ['F','W','T'];
const ELEM_LABELS = { F:'Fire', W:'Water', T:'Timber' };

// ── State ──────────────────────────────────────────────────────────────────
let coll = {};
let currentUser = null;
let saveQueue = {};
let saveTimer = null;

const getC = num => coll[num] || { figure:0, weapon:0, element:null };

function setC(num, updates) {
  if (!coll[num]) coll[num] = { figure:0, weapon:0, element:null };
  Object.assign(coll[num], updates);
  queueSave(num);
}

// ── Firestore save (debounced) ─────────────────────────────────────────────
function queueSave(num) {
  saveQueue[num] = true;
  showSync(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 1000);
}

async function flushSave() {
  if (!currentUser) return;
  const nums = Object.keys(saveQueue).map(Number);
  saveQueue = {};
  try {
    const batch = writeBatch(db);
    for (const num of nums) {
      const ref = doc(db, 'users', currentUser.uid, 'collection', String(num));
      batch.set(ref, {
        figure:  coll[num]?.figure  || 0,
        weapon:  coll[num]?.weapon  || 0,
        element: coll[num]?.element || null,
        updated: serverTimestamp(),
      });
    }
    await batch.commit();
  } catch(e) { console.error('Save error:', e); }
  showSync(false);
}

function showSync(on) {
  document.getElementById('sync-dot').classList.toggle('active', on);
}

// ── Load from Firestore ────────────────────────────────────────────────────
async function loadColl(uid) {
  try {
    const snap = await getDocs(collection(db, 'users', uid, 'collection'));
    coll = {};
    snap.forEach(d => {
      const data = d.data();
      coll[parseInt(d.id)] = {
        figure:  data.figure  || 0,
        weapon:  data.weapon  || 0,
        element: data.element || null,
      };
    });
  } catch(e) { console.error('Load error:', e); }
}

// ── Screen helper ──────────────────────────────────────────────────────────
function showScreen(w) {
  document.getElementById('loading-screen').style.display = w==='loading' ? 'flex' : 'none';
  document.getElementById('auth-screen').style.display    = w==='auth'    ? 'flex' : 'none';
  const appEl = document.getElementById('app-screen');
  appEl.style.display = w==='app' ? 'flex' : 'none';
  if (w==='app') appEl.style.flexDirection = 'column';
}

// ── Auth helpers ───────────────────────────────────────────────────────────
let authMode = 'login';

window.switchTab = mode => {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('on', mode==='login');
  document.getElementById('tab-signup').classList.toggle('on', mode==='signup');
  document.getElementById('auth-btn').textContent = mode==='login' ? 'Login' : 'Create Account';
  setMsg('', false);
};

window.doAuth = async () => {
  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn      = document.getElementById('auth-btn');
  if (!email || !password) { setMsg('Please enter email and password.', true); return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      await createUserWithEmailAndPassword(auth, email, password);
    }
  } catch(e) {
    const map = {
      'auth/invalid-email':        'Invalid email address.',
      'auth/user-not-found':       'No account with that email.',
      'auth/wrong-password':       'Incorrect password.',
      'auth/email-already-in-use': 'Account already exists with that email.',
      'auth/weak-password':        'Password must be at least 6 characters.',
      'auth/invalid-credential':   'Incorrect email or password.',
      'auth/too-many-requests':    'Too many attempts — try again later.',
    };
    setMsg(map[e.code] || e.message, true);
    btn.disabled = false;
    btn.textContent = authMode==='login' ? 'Login' : 'Create Account';
  }
};

window.doLogout = async () => {
  await signOut(auth);
};

window.doReset = async () => {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) { setMsg('Enter your email above first.', true); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    setMsg('Password reset email sent!', false);
  } catch(e) { setMsg('Could not send reset email.', true); }
};

function setMsg(text, isErr) {
  const el = document.getElementById('auth-msg');
  el.textContent = text;
  el.className = 'auth-msg' + (isErr ? ' err' : '');
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && document.getElementById('auth-screen').style.display==='flex')
    window.doAuth();
});

// ── Auth state ─────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    document.getElementById('user-btn').textContent = '👤 ' + user.email.split('@')[0];
    showScreen('loading');
    await loadColl(user.uid);
    render();
    showScreen('app');
  } else {
    currentUser = null;
    coll = {};
    showScreen('auth');
  }
});

// ── Stars ──────────────────────────────────────────────────────────────────
function starSVG(filled) {
  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
      fill="${filled?'#f0b429':'none'}" stroke="${filled?'#f0b429':'#4a4a80'}"
      stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

function makeStars(val, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'stars';
  const els = [];
  let last = null;
  const update = v => els.forEach((s,i) => s.innerHTML = starSVG(i < v));
  for (let i=1; i<=3; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.innerHTML = starSVG(i <= val);
    els.push(s);
    const idx = i;
    s.addEventListener('click', () => {
      const nv = last===idx ? 0 : idx;
      last = nv===0 ? null : idx;
      update(nv); onChange(nv);
    });
    wrap.appendChild(s);
  }
  return wrap;
}

// ── Element row ────────────────────────────────────────────────────────────
function makeElemRow(num, curElem) {
  const row = document.createElement('div');
  row.className = 'elem-row';
  const btns = {};
  for (const key of ELEMS) {
    const btn = document.createElement('div');
    btn.className = 'elem-btn' + (curElem===key ? ' sel' : '');
    btn.title = ELEM_LABELS[key];
    const img = document.createElement('img');
    img.alt = ELEM_LABELS[key];
    img.src = `${IMG}${key}.JPG`;
    img.onerror = function() {
      if (!this._t) { this._t=true; this.src=`${IMG}${key.toLowerCase()}.jpg`; return; }
      this.style.display='none';
      const ph=document.createElement('div'); ph.className='elem-ph'; ph.textContent=key;
      btn.appendChild(ph);
    };
    btn.appendChild(img);
    btn.addEventListener('click', () => {
      const ne = getC(num).element===key ? null : key;
      setC(num, { element: ne });
      for (const k of ELEMS) btns[k].classList.toggle('sel', k===ne);
    });
    btns[key]=btn; row.appendChild(btn);
  }
  return row;
}

// ── Render ─────────────────────────────────────────────────────────────────
let currentFilter = 'all';
let currentSearch = '';

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const srch = currentSearch.toLowerCase();
  let shown=0, owned=0;

  for (const [num, name] of BEASTS) {
    const d = getC(num);
    const isOwned = d.figure > 0;
    if (isOwned) owned++;
    if (currentFilter==='owned'   && !isOwned) continue;
    if (currentFilter==='unowned' &&  isOwned) continue;
    if (srch && !name.toLowerCase().includes(srch) && !String(num).includes(srch)) continue;
    shown++;

    const card = document.createElement('div');
    card.className = 'card' + (isOwned ? ' owned' : '');

    // Image with case fallback
    const wrap = document.createElement('div');
    wrap.className = 'card-img-wrap';
    const img = document.createElement('img');
    img.loading='lazy'; img.alt=name;
    img.src = `${IMG}${num}.jpg`;
    img.onerror = function() {
      if (!this._t) { this._t=true; this.src=`${IMG}${num}.JPG`; return; }
      this.style.display='none';
      const ph=document.createElement('div'); ph.className='card-ph'; ph.textContent=num;
      wrap.appendChild(ph);
    };
    wrap.appendChild(img); card.appendChild(wrap);

    // Name
    const nm=document.createElement('div'); nm.className='card-name';
    nm.textContent=`#${num} ${name}`; card.appendChild(nm);

    // Figure stars
    const fr=document.createElement('div'); fr.className='star-row';
    const fl=document.createElement('div'); fl.className='star-label'; fl.textContent='Figure';
    fr.appendChild(fl);
    fr.appendChild(makeStars(d.figure, v => {
      setC(num,{figure:v}); card.classList.toggle('owned',v>0); recalcStats();
    }));
    card.appendChild(fr);

    // Weapon stars
    const wr=document.createElement('div'); wr.className='star-row';
    const wl=document.createElement('div'); wl.className='star-label'; wl.textContent='Weapon';
    wr.appendChild(wl);
    wr.appendChild(makeStars(d.weapon, v => setC(num,{weapon:v})));
    card.appendChild(wr);

    card.appendChild(makeElemRow(num, d.element));
    grid.appendChild(card);
  }

  if (!shown) {
    const e=document.createElement('div'); e.className='empty';
    e.textContent='No beasts found.'; grid.appendChild(e);
  }
  setStats(shown, owned);
}

function setStats(shown, owned) {
  document.getElementById('stats').innerHTML =
    `<b>${shown}</b>/${BEASTS.length} &nbsp;·&nbsp; Owned <b>${owned}</b>/${BEASTS.length}`;
}

function recalcStats() {
  let owned=0, shown=0;
  const srch = currentSearch.toLowerCase();
  for (const [num,name] of BEASTS) {
    const d=getC(num);
    if (d.figure>0) owned++;
    if (currentFilter==='owned'   && d.figure===0) continue;
    if (currentFilter==='unowned' && d.figure>0)   continue;
    if (srch && !name.toLowerCase().includes(srch) && !String(num).includes(srch)) continue;
    shown++;
  }
  setStats(shown, owned);
}

// ── Toolbar ────────────────────────────────────────────────────────────────
document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentFilter = btn.dataset.f;
    render();
  });
});
document.getElementById('search').addEventListener('input', e => {
  currentSearch=e.target.value; render();
});

// ── CSV Export ─────────────────────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  const rows=['number,name,series,figure,weapon,element'];
  for (const [num,name,series] of BEASTS) {
    const d=getC(num);
    rows.push(`${num},"${name}","${series}",${d.figure},${d.weapon},"${d.element||''}"`);
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='battle_beasts_collection.csv'; a.click();
  toast('Collection exported!');
});

// ── CSV Import ─────────────────────────────────────────────────────────────
document.getElementById('btn-import').addEventListener('click', () =>
  document.getElementById('csv-file').click());

document.getElementById('csv-file').addEventListener('change', e => {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev => {
    try {
      const lines=ev.target.result.trim().split('\n');
      if(!lines[0].toLowerCase().includes('figure')) throw new Error('Invalid CSV');
      let count=0;
      for(let i=1;i<lines.length;i++){
        const p=lines[i].split(',');
        const num=parseInt(p[0]); if(!num) continue;
        const elem=(p[5]||'').replace(/"/g,'').trim().toUpperCase();
        coll[num]={ figure:parseInt(p[3])||0, weapon:parseInt(p[4])||0,
                    element:ELEMS.includes(elem)?elem:null };
        queueSave(num); count++;
      }
      render(); toast(`Imported ${count} beasts!`);
    } catch(err){ alert('Import failed: '+err.message); }
    e.target.value='';
  };
  reader.readAsText(file);
});

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// Show auth screen initially — onAuthStateChanged will handle the rest
showScreen('auth');
</script>
