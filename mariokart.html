<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d1a">
<title>Mario Kart Checklist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap');
:root{--bg:#0d0d1a;--surface:#141428;--card:#1a1a35;--card-own:#2a1020;--border:#2a2a50;--accent:#e52521;--gold:#fbd000;--green:#43b047;--fg:#e8e8f0;--dim:#6666aa;--mid:#9999cc}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:'Barlow',sans-serif;overscroll-behavior:none}
.screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:380px}
.auth-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;color:var(--accent);text-align:center;letter-spacing:2px;text-transform:uppercase}
.auth-sub{text-align:center;color:var(--dim);font-size:13px;margin:4px 0 22px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;color:var(--mid);margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.auth-field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--fg);font-size:14px;outline:none}
.auth-field input:focus{border-color:var(--accent)}
.btn-main{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;letter-spacing:1px;cursor:pointer}
.btn-main:disabled{background:var(--border)}
.auth-msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px;color:var(--accent)}
.auth-note{text-align:center;font-size:12px;color:var(--dim);margin-top:14px;line-height:1.4}
.auth-note a{color:var(--mid)}
#app-screen{display:none;flex-direction:column;min-height:100vh}
.toolbar{position:sticky;top:0;z-index:100;background:rgba(10,10,22,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:9px 12px 7px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row+.row{margin-top:7px}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.logo a{color:var(--dim);text-decoration:none;font-size:12px;margin-left:6px;letter-spacing:.5px}
.search{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 11px;color:var(--fg);font-size:14px;outline:none}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--mid);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cats{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.stats{font-size:11px;color:var(--dim)}
.stats b{color:var(--gold)}
.right{margin-left:auto;display:flex;gap:5px;align-items:center}
.sync{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .3s}
.sync.on{opacity:1}
.sync.err{opacity:1;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 8px 80px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(6,1fr);gap:10px}}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:6px 6px 8px;display:flex;flex-direction:column;transition:border-color .2s,background .2s}
.card.owned{background:var(--card-own);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.imgwrap{position:relative;width:100%;aspect-ratio:1;background:#fff;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.imgwrap img{width:100%;height:100%;object-fit:contain}
.imgwrap.flip{cursor:pointer}
.ph{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;color:#999;text-align:center;padding:8px}
.flipbadge{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-weight:700;pointer-events:none}
.toy{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.5px}
.name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:var(--gold);line-height:1.15}
.sub{font-size:11.5px;color:var(--mid);line-height:1.3;margin-top:2px;flex:1}
.toggles{display:flex;gap:5px;margin-top:7px}
.tg{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;padding:6px 0;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tg.on{background:var(--green);border-color:var(--green);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-size:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);color:var(--fg);font-size:13px;padding:9px 18px;border-radius:20px;transition:transform .3s;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
#csv-file{display:none}
.imgwrap.zoom{cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
#zoom.show{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
#zoom .zcap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;text-shadow:0 1px 4px #000;pointer-events:none}
</style>
</head>
<body>
<div id="loading-screen" class="screen" style="display:flex"><div class="spinner"></div></div>

<div id="auth-screen" class="screen">
  <div class="auth-box">
    <div class="auth-logo">Mario Kart</div>
    <div class="auth-sub">Hot Wheels Collector Checklist</div>
    <div class="auth-field"><label>Email</label><input type="email" id="auth-email" autocomplete="email"></div>
    <div class="auth-field"><label>Password</label><input type="password" id="auth-password" autocomplete="current-password"></div>
    <button class="btn-main" id="auth-btn">Login</button>
    <div class="auth-msg" id="auth-msg"></div>
    <div class="auth-note">Same login as your Battle Beasts checklist.<br>Need an account? <a href="./">Sign up there first</a>.</div>
  </div>
</div>

<div id="app-screen">
  <div class="toolbar">
    <div class="row">
      <div class="logo">Mario Kart<a href="./">⚔ Battle Beasts</a></div>
      <input class="search" id="search" type="search" placeholder="Search name, kart, toy #…" autocomplete="off">
      <button class="chip" id="btn-user">Sign Out</button>
    </div>
    <div class="row cats" id="cats"></div>
    <div class="row">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="owned">Owned</button>
      <button class="chip" data-f="unowned">Unowned</button>
      <span class="stats" id="stats"></span>
      <div class="right">
        <span class="sync" id="sync" title="Saving…"></span>
        <button class="chip" id="btn-export">Export</button>
        <button class="chip" id="btn-import">Import</button>
        <input type="file" id="csv-file" accept=".csv">
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>
<div id="zoom"><img alt=""><div class="zcap"></div></div>

let coll = {}, user = null, queue = new Set(), timer = null;
let cat = 'All', filter = 'all', q = '';
const $ = id => document.getElementById(id);
const isOwned = id => !!coll[id];

function show(w){
  for (const s of ['loading','auth']) $(s+'-screen').style.display = w===s ? 'flex' : 'none';
  $('app-screen').style.display = w==='app' ? 'flex' : 'none';
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }

// ── Saving: failures are shown, never silent ──
function setItem(id, owned){ coll[id] = owned; queue.add(id); $('sync').className='sync on'; clearTimeout(timer); timer=setTimeout(flush,800); }
async function flush(){
  if (!user || !queue.size) return;
  const ids=[...queue]; queue.clear();
  try{
    for (let i=0;i<ids.length;i+=400){
      const b=writeBatch(db);
      for (const id of ids.slice(i,i+400)) b.set(doc(db,'users',user.uid,COLL,id), { owned: !!coll[id], updated: serverTimestamp() });
      await b.commit();
    }
    $('sync').className='sync';
  }catch(e){
    console.error(e); ids.forEach(id=>queue.add(id)); $('sync').className='sync err';
    toast('⚠ Not saved to your account: '+(e.code||e.message));
  }
}
window.addEventListener('beforeunload', flush);

async function load(uid){
  coll={};
  try{
    const snap=await getDocs(collection(db,'users',uid,COLL));
    snap.forEach(d=>{ const x=d.data(); if (x.owned) coll[d.id]=true; });
  }catch(e){ console.error(e); toast('⚠ Could not load your collection: '+(e.code||e.message)); }
}

// ── Full-screen zoom (tap again to close) ──
function openZoom(src, cap){
  const z=$('zoom'), im=z.querySelector('img');
  im.src=src.replace(/\/scale-to-width-down\/\d+/,'');   // full-size picture
  im.onerror=()=>{ im.onerror=null; im.src=src; };        // fall back to the thumbnail size
  z.querySelector('.zcap').textContent=cap; z.classList.add('show');
}
$('zoom').onclick=()=>$('zoom').classList.remove('show');
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('zoom').classList.remove('show'); });

// ── Rendering ──
function renderCats(){
  $('cats').innerHTML='';
  for (const c of CATS){
    const b=document.createElement('button'); b.className='chip'+(c===cat?' on':''); b.textContent=c;
    b.onclick=()=>{ cat=c; renderCats(); render(); }; $('cats').appendChild(b);
  }
}
function matches(i){
  if (cat!=='All' && i.cat!==cat) return false;
  if (filter==='owned' && !isOwned(i.id)) return false;
  if (filter==='unowned' && isOwned(i.id)) return false;
  if (q && !(i.title+' '+i.sub+' '+i.toy+' '+i.cat).toLowerCase().includes(q)) return false;
  return true;
}
function stats(){
  const pool=ITEMS.filter(i=>cat==='All'||i.cat===cat);
  const own=pool.filter(i=>isOwned(i.id)).length;
  $('stats').innerHTML=`Owned <b>${own}</b>/${pool.length}`;
}
function render(){
  const g=$('grid'); g.innerHTML='';
  const list=ITEMS.filter(matches);
  for (const i of list){
    const card=document.createElement('div'); card.className='card'+(isOwned(i.id)?' owned':'');
    const w=document.createElement('div'); w.className='imgwrap';
    const pics=[i.img,i.img2].filter(Boolean);
    if (pics.length){
      let k=0; const im=document.createElement('img'); im.loading='lazy'; im.alt=i.title; im.referrerPolicy='no-referrer'; im.src=pics[0];
      im.onerror=()=>{ im.remove(); w.querySelector('.flipbadge')?.remove(); w.onclick=null; w.insertAdjacentHTML('afterbegin',`<div class="ph">No picture<br>${i.toy||''}</div>`); };
      w.appendChild(im);
      if (pics.length>1){
        w.classList.add('flip'); const bd=document.createElement('span'); bd.className='flipbadge'; bd.textContent='Loose ⇄'; w.appendChild(bd);
        w.onclick=()=>{ k=1-k; im.src=pics[k]; bd.textContent=k?'Carded ⇄':'Loose ⇄'; };
      } else {
        w.classList.add('zoom'); const bd=document.createElement('span'); bd.className='flipbadge'; bd.textContent='⤢ Zoom'; w.appendChild(bd);
        w.onclick=()=>openZoom(pics[0], i.title);
      }
    } else w.innerHTML=`<div class="ph">No picture yet<br>${i.toy||''}</div>`;
    card.appendChild(w);
    card.insertAdjacentHTML('beforeend',`<div class="toy">${i.cat}${i.toy?' · '+i.toy:''}</div><div class="name"></div><div class="sub"></div>`);
    card.querySelector('.name').textContent=i.title; card.querySelector('.sub').textContent=i.sub;
    const t=document.createElement('div'); t.className='toggles';
    const b=document.createElement('button'); const lab=()=>{ const o=isOwned(i.id); b.className='tg'+(o?' on':''); b.textContent=o?'✓ Owned':'Owned?'; }; lab();
    b.onclick=()=>{ setItem(i.id,!isOwned(i.id)); lab(); card.classList.toggle('owned',isOwned(i.id)); stats(); };
    t.appendChild(b); card.appendChild(t); g.appendChild(card);
  }
  if (!list.length) g.innerHTML='<div class="empty">Nothing matches.</div>';
  stats();
}

// ── Toolbar ──
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter=b.dataset.f; render(); });
$('search').oninput=e=>{ q=e.target.value.toLowerCase().trim(); render(); };
$('btn-user').onclick=async()=>{ await flush(); signOut(auth); };

$('btn-export').onclick=()=>{
  const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=['id,category,toy,name,details,owned', ...ITEMS.map(i=>[i.id,i.cat,i.toy,i.title,i.sub].map(esc).join(',')+`,${isOwned(i.id)?1:0}`)];
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'})); a.download='mario_kart_collection.csv'; a.click(); toast('Exported');
};
$('btn-import').onclick=()=>$('csv-file').click();
$('csv-file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=ev=>{
    const known=new Set(ITEMS.map(i=>i.id)); let n=0;
    for (const line of ev.target.result.trim().split(/\r?\n/).slice(1)){
      const id=(line.match(/^"((?:[^"]|"")*)"/)||[])[1]; const m=line.match(/,(\d)\s*$/);
      if (id && m && known.has(id)){ setItem(id,m[1]==='1'); n++; }
    }
    render(); toast(`Imported ${n} items`); e.target.value='';
  };
  r.readAsText(f);
};

// ── Auth ──
async function doLogin(){
  const email=$('auth-email').value.trim(), pw=$('auth-password').value, btn=$('auth-btn');
  if(!email||!pw){ $('auth-msg').textContent='Enter email and password.'; return; }
  btn.disabled=true; btn.textContent='…';
  try{ await signInWithEmailAndPassword(auth,email,pw); }
  catch(e){ $('auth-msg').textContent=e.code==='auth/invalid-credential'?'Incorrect email or password.':(e.code||e.message); btn.disabled=false; btn.textContent='Login'; }
}
$('auth-btn').onclick=doLogin;
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && $('auth-screen').style.display==='flex') doLogin(); });

onAuthStateChanged(auth, async u=>{
  if(u){ user=u; $('btn-user').textContent='👤 '+u.email.split('@')[0]; show('loading'); await load(u.uid); renderCats(); render(); show('app'); }
  else { user=null; coll={}; const b=$('auth-btn'); b.disabled=false; b.textContent='Login'; show('auth'); }
});
</script>
</body>
</html>
